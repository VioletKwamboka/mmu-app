<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: sans-serif; background: #1e1e1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin:0; }
.card { background: white; width: 320px; padding: 40px 25px; border-radius: 20px; text-align: center; }
h1 { color: #2c3e9e; margin:0; font-size: 36px; }
.subtitle { color: #333; margin-top:10px; margin-bottom:30px; font-weight:600; }
label { display:block; text-align:left; font-size:13px; color:#2c3e9e; margin: 15px 0 5px; }
input { width:100%; height:50px; border-radius:12px; border:1.5px solid #ddd; padding:0 15px; box-sizing:border-box; }
.forgot { text-align:right; font-size:12px; color:#2c3e9e; margin-top:8px; }
button { width:100%; height:50px; background:#2f5bda; color:white; border:none; border-radius:12px; margin-top:25px; font-weight:bold; }
.signup { font-size:13px; margin-top:20px; color:#666; }
.footer { font-size:11px; color:#aaa; margin-top:50px; }
</style>
</head>
<body>
<div class="card">
<h1>MMU</h1>
<div class="subtitle">Welcome back, Student</div>
<label>Admission Number</label>
<input placeholder="Enter admission number">
<label>Password</label>
<input placeholder="Enter password" type="password">
<div class="forgot">Forgot Password?</div>
<button onclick="window.location.href='dashboard.html'">LOGIN</button>
<div class="signup">Don't have an account? <b style="color:#2f5bda">Sign up</b></div>
<div class="footer">Multimedia University of Kenya</div>
</div>
</body>
</html>
